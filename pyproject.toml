[project]
name = "hk3d"
version = "0.1.0"
description = "Turn Hong Kong LandsD 3D Digital Map tiles into 3D-printable circular miniature models"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "open3d>=0.18",
    "manifold3d>=3.0",
    "trimesh>=4.0",
    "pyproj>=3.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10",
    "matplotlib>=3.8",
    "fast-simplification>=0.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hk3d = "hk3d.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hk3d*"]
